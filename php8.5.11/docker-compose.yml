services:
  target:
    image: php:8.5.11-apache
    platform: linux/amd64
    container_name: php2shell-target
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-php2shell.ini:ro
      - ./docker/apache.conf:/etc/apache2/conf-enabled/zz-php2shell.conf:ro
      - ./www:/var/www/html:ro
      - ./out:/out
    command:
      - /bin/sh
      - -c
      - chown -R www-data:www-data /out 2>/dev/null || true; exec apache2-foreground
    restart: unless-stopped
